<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이모티콘 컷팅 메이커 ✂️</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Gowun Dodum', sans-serif;
    background: linear-gradient(135deg, #FFE5EC 0%, #FFF5E1 50%, #E5F4FF 100%);
    min-height: 100vh;
    padding: 20px;
    color: #4A4A4A;
  }
  
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  
  .header {
    text-align: center;
    padding: 30px 20px 40px;
  }
  
  .header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 3rem;
    color: #FF6B9D;
    margin-bottom: 10px;
    text-shadow: 3px 3px 0 #FFD93D;
    letter-spacing: 2px;
  }
  
  .header p {
    font-size: 1.1rem;
    color: #6B6B6B;
  }
  
  .upload-area {
    background: white;
    border: 4px dashed #FFB6C1;
    border-radius: 24px;
    padding: 60px 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 30px;
    box-shadow: 0 8px 30px rgba(255, 107, 157, 0.1);
  }
  
  .upload-area:hover {
    border-color: #FF6B9D;
    background: #FFF9FB;
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(255, 107, 157, 0.2);
  }
  
  .upload-area.dragover {
    border-color: #FF6B9D;
    background: #FFE5EC;
    transform: scale(1.01);
  }
  
  .upload-icon {
    font-size: 4rem;
    margin-bottom: 15px;
    display: block;
  }
  
  .upload-area h3 {
    font-family: 'Gaegu', cursive;
    font-size: 1.8rem;
    color: #FF6B9D;
    margin-bottom: 8px;
  }
  
  .upload-area p {
    color: #888;
    font-size: 0.95rem;
  }
  
  #fileInput {
    display: none;
  }
  
  .controls {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    display: none;
  }
  
  .controls.active {
    display: block;
  }
  
  .control-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 15px;
  }
  
  .control-row:last-child {
    margin-bottom: 0;
  }
  
  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .control-group label {
    font-weight: 600;
    color: #555;
    font-size: 0.95rem;
  }
  
  .control-group input[type="number"] {
    width: 70px;
    padding: 8px 12px;
    border: 2px solid #FFD6E0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1rem;
    text-align: center;
  }
  
  .control-group input[type="number"]:focus {
    outline: none;
    border-color: #FF6B9D;
  }
  
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-family: 'Gaegu', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #FF6B9D, #FF8FAB);
    color: white;
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
  }
  
  .btn-secondary {
    background: linear-gradient(135deg, #6BCB77, #95E1A3);
    color: white;
    box-shadow: 0 4px 15px rgba(107, 203, 119, 0.3);
  }
  
  .btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(107, 203, 119, 0.4);
  }
  
  .btn-download-all {
    background: linear-gradient(135deg, #4D96FF, #6BCBFF);
    color: white;
    box-shadow: 0 4px 15px rgba(77, 150, 255, 0.3);
    width: 100%;
    padding: 16px;
    font-size: 1.4rem;
  }
  
  .btn-download-all:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(77, 150, 255, 0.4);
  }
  
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }
  
  .preview-section {
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    display: none;
  }
  
  .preview-section.active {
    display: block;
  }
  
  .preview-section h2 {
    font-family: 'Gaegu', cursive;
    font-size: 2rem;
    color: #FF6B9D;
    margin-bottom: 20px;
    text-align: center;
  }
  
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
  }
  
  @media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 2.2rem; }
  }
  
  .cell {
    background: 
      linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
      linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: white;
    border-radius: 15px;
    padding: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: transform 0.2s ease;
  }
  
  .cell:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  
  .cell-number {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #FF6B9D;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  
  .cell canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
  
  .cell-download {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(255, 107, 157, 0.9);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 2;
  }
  
  .cell-download:hover {
    background: #FF6B9D;
    transform: scale(1.1);
  }
  
  .loading {
    text-align: center;
    padding: 40px;
    display: none;
  }
  
  .loading.active {
    display: block;
  }
  
  .loading-spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #FFE5EC;
    border-top-color: #FF6B9D;
    border-radius: 50%;
    margin: 0 auto 15px;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .loading p {
    font-family: 'Gaegu', cursive;
    font-size: 1.3rem;
    color: #FF6B9D;
  }
  
  .help-text {
    background: #FFF9E6;
    border-left: 4px solid #FFD93D;
    padding: 15px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    color: #7A6F3D;
  }
  
  .help-text strong {
    color: #FF6B9D;
  }
  
  .footer {
    text-align: center;
    padding: 30px 0;
    color: #888;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="container">
  
  <div class="header">
    <h1>✂️ 이모티콘 컷팅 메이커</h1>
    <p>이모티콘 시트를 올리면 12개로 잘라주고 배경까지 깔끔하게 지워드려요!</p>
  </div>
  
  <label for="fileInput" class="upload-area" id="uploadArea">
    <span class="upload-icon">🖼️</span>
    <h3>여기에 이미지를 올려주세요</h3>
    <p>클릭하거나 파일을 끌어다 놓으세요 (PNG, JPG)</p>
  </label>
  <input type="file" id="fileInput" accept="image/*">
  
  <div class="controls" id="controls">
    <div class="help-text">
      💡 <strong>팁:</strong> 분할이 정확하지 않다면 행/열 개수와 여백을 조절해보세요. 배경 제거 강도도 조절 가능해요!
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>가로:</label>
        <input type="number" id="cols" value="4" min="1" max="10">
        <span>칸</span>
      </div>
      <div class="control-group">
        <label>세로:</label>
        <input type="number" id="rows" value="3" min="1" max="10">
        <span>칸</span>
      </div>
      <div class="control-group">
        <label>여백:</label>
        <input type="number" id="padding" value="10" min="0" max="100">
        <span>px</span>
      </div>
      <div class="control-group">
        <label>배경 제거 강도:</label>
        <input type="number" id="threshold" value="240" min="200" max="255">
      </div>
    </div>
    <div class="control-row">
      <button class="btn btn-primary" id="processBtn">✨ 자르기 시작!</button>
      <button class="btn btn-secondary" id="resetBtn">🔄 다시 올리기</button>
    </div>
  </div>
  
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <p>열심히 자르는 중이에요...</p>
  </div>
  
  <div class="preview-section" id="previewSection">
    <h2>🎉 짠~ 완성됐어요!</h2>
    <div class="grid" id="grid"></div>
    <button class="btn btn-download-all" id="downloadAllBtn">📦 전체 ZIP 파일로 다운로드</button>
  </div>
  
  <div class="footer">
    <p>💕 만든 이모티콘은 카톡, SNS 어디든 사용하세요!</p>
  </div>
  
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  const fileInput = document.getElementById('fileInput');
  const uploadArea = document.getElementById('uploadArea');
  const controls = document.getElementById('controls');
  const previewSection = document.getElementById('previewSection');
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const processBtn = document.getElementById('processBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  
  let originalImage = null;
  let processedCanvases = [];
  
  // 드래그 앤 드롭
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });
  
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      handleFile(file);
    }
  });
  
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });
  
  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        originalImage = img;
        controls.classList.add('active');
        // 자동 처리
        processImage();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  
  processBtn.addEventListener('click', processImage);
  
  resetBtn.addEventListener('click', () => {
    fileInput.value = '';
    originalImage = null;
    processedCanvases = [];
    controls.classList.remove('active');
    previewSection.classList.remove('active');
    grid.innerHTML = '';
  });
  
  function processImage() {
    if (!originalImage) return;
    
    loading.classList.add('active');
    previewSection.classList.remove('active');
    grid.innerHTML = '';
    processedCanvases = [];
    
    setTimeout(() => {
      const cols = parseInt(document.getElementById('cols').value);
      const rows = parseInt(document.getElementById('rows').value);
      const padding = parseInt(document.getElementById('padding').value);
      const threshold = parseInt(document.getElementById('threshold').value);
      
      const cellWidth = originalImage.width / cols;
      const cellHeight = originalImage.height / rows;
      
      let count = 1;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          // 셀 영역 자르기
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          const sx = col * cellWidth + padding;
          const sy = row * cellHeight + padding;
          const sw = cellWidth - padding * 2;
          const sh = cellHeight - padding * 2;
          
          canvas.width = sw;
          canvas.height = sh;
          
          ctx.drawImage(originalImage, sx, sy, sw, sh, 0, 0, sw, sh);
          
          // 배경 제거 (흰색/밝은색 → 투명)
          removeBackground(ctx, canvas.width, canvas.height, threshold);
          
          // 빈 영역 트리밍
          const trimmed = trimCanvas(canvas);
          
          processedCanvases.push(trimmed);
          
          // 셀 UI 생성
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerHTML = `<div class="cell-number">${count}</div>`;
          
          const displayCanvas = document.createElement('canvas');
          displayCanvas.width = trimmed.width;
          displayCanvas.height = trimmed.height;
          displayCanvas.getContext('2d').drawImage(trimmed, 0, 0);
          cell.appendChild(displayCanvas);
          
          const dlBtn = document.createElement('button');
          dlBtn.className = 'cell-download';
          dlBtn.innerHTML = '⬇';
          dlBtn.title = '다운로드';
          const cellNum = count;
          dlBtn.onclick = (e) => {
            e.preventDefault();
            downloadCanvas(trimmed, `emoticon_${String(cellNum).padStart(2, '0')}.png`);
          };
          cell.appendChild(dlBtn);
          
          grid.appendChild(cell);
          count++;
        }
      }
      
      loading.classList.remove('active');
      previewSection.classList.add('active');
      previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
  
  function removeBackground(ctx, width, height, threshold) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    
    // 가장자리 색상 샘플링 (배경색 추정)
    const samples = [];
    const step = 5;
    for (let x = 0; x < width; x += step) {
      samples.push([data[(0 * width + x) * 4], data[(0 * width + x) * 4 + 1], data[(0 * width + x) * 4 + 2]]);
      samples.push([data[((height-1) * width + x) * 4], data[((height-1) * width + x) * 4 + 1], data[((height-1) * width + x) * 4 + 2]]);
    }
    for (let y = 0; y < height; y += step) {
      samples.push([data[(y * width + 0) * 4], data[(y * width + 0) * 4 + 1], data[(y * width + 0) * 4 + 2]]);
      samples.push([data[(y * width + width-1) * 4], data[(y * width + width-1) * 4 + 1], data[(y * width + width-1) * 4 + 2]]);
    }
    
    // 평균 배경색
    let avgR = 0, avgG = 0, avgB = 0;
    samples.forEach(s => { avgR += s[0]; avgG += s[1]; avgB += s[2]; });
    avgR /= samples.length;
    avgG /= samples.length;
    avgB /= samples.length;
    
    // 색상 거리 기반 배경 제거
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      
      // 흰색/밝은색 기준 + 배경색 유사 기준
      const brightness = (r + g + b) / 3;
      const distFromBg = Math.sqrt(
        Math.pow(r - avgR, 2) + 
        Math.pow(g - avgG, 2) + 
        Math.pow(b - avgB, 2)
      );
      
      if (brightness > threshold || distFromBg < 25) {
        data[i + 3] = 0; // 완전 투명
      } else if (brightness > threshold - 25 || distFromBg < 45) {
        // 가장자리 부드럽게
        const fade = Math.max(0, Math.min(1, (threshold - brightness) / 25));
        data[i + 3] = Math.floor(data[i + 3] * fade);
      }
    }
    
    ctx.putImageData(imageData, 0, 0);
  }
  
  function trimCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const data = ctx.getImageData(0, 0, w, h).data;
    
    let top = h, bottom = 0, left = w, right = 0;
    let found = false;
    
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const alpha = data[(y * w + x) * 4 + 3];
        if (alpha > 10) {
          found = true;
          if (y < top) top = y;
          if (y > bottom) bottom = y;
          if (x < left) left = x;
          if (x > right) right = x;
        }
      }
    }
    
    if (!found) return canvas;
    
    const margin = 5;
    top = Math.max(0, top - margin);
    bottom = Math.min(h - 1, bottom + margin);
    left = Math.max(0, left - margin);
    right = Math.min(w - 1, right + margin);
    
    const newW = right - left + 1;
    const newH = bottom - top + 1;
    
    const newCanvas = document.createElement('canvas');
    newCanvas.width = newW;
    newCanvas.height = newH;
    newCanvas.getContext('2d').drawImage(canvas, left, top, newW, newH, 0, 0, newW, newH);
    
    return newCanvas;
  }
  
  function downloadCanvas(canvas, filename) {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  }
  
  downloadAllBtn.addEventListener('click', async () => {
    if (processedCanvases.length === 0) return;
    
    downloadAllBtn.disabled = true;
    downloadAllBtn.textContent = '📦 압축 중...';
    
    const zip = new JSZip();
    
    for (let i = 0; i < processedCanvases.length; i++) {
      const blob = await new Promise(resolve => processedCanvases[i].toBlob(resolve, 'image/png'));
      zip.file(`emoticon_${String(i + 1).padStart(2, '0')}.png`, blob);
    }
    
    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'emoticons.zip';
    a.click();
    URL.revokeObjectURL(url);
    
    downloadAllBtn.disabled = false;
    downloadAllBtn.innerHTML = '📦 전체 ZIP 파일로 다운로드';
  });
</script>
</body>
</html>
